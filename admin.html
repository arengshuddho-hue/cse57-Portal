<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | CSE-57 Section C</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

<!-- Login Screen -->
<div class="container" id="loginScreen">
  <h2 style="color: var(--gold);"><i class="fa-solid fa-shield-halved"></i> Secure Admin Login</h2>
  <div class="form-group">
    <input type="email" id="adminEmail" placeholder="Enter Admin Email" style="margin-bottom: 15px;">
    <input type="password" id="password" placeholder="Enter Admin Password">
  </div>
  <button class="btn" onclick="login()" style="width: 100%;">Secure Login</button>
  <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Authenticating...</div>
</div>

<!-- Admin Dashboard -->
<div class="container" id="adminScreen" style="display:none;">
  <div class="header">
    <h1><i class="fa-solid fa-gear"></i> Admin Dashboard</h1>

    <!-- Desktop buttons -->
    <div class="header-actions">
      <a href="index.html" target="_blank" class="btn" style="margin-right: 10px;"><i class="fa-solid fa-eye"></i> View Portal</a>
      <button class="btn" style="background: #e74c3c;" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>

    <!-- Mobile hamburger -->
    <div class="menu-wrapper">
      <button class="hamburger-btn" onclick="toggleMenu()" id="hamburgerBtn">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="dropdown-menu" id="dropdownMenu">
        <a href="index.html" target="_blank" class="dropdown-item">
          <i class="fa-solid fa-eye"></i> View Portal
        </a>
        <button class="dropdown-item dropdown-item-danger" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById('dropdownMenu').classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
      const wrapper = document.querySelector('.menu-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        document.getElementById('dropdownMenu').classList.remove('open');
      }
    });
  </script>
  <div id="statsCard" style="display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap;">
    <div style="flex:1; min-width:140px; background:rgba(163,113,247,0.06); border:1px solid rgba(163,113,247,0.2); border-radius:12px; padding:16px 20px;">
      <div style="font-size:0.7em; color:#8b949e; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px;">🟢 Active Now</div>
      <div id="statActiveNow" style="font-size:2em; font-weight:700; color:#56d364;">—</div>
    </div>
    <div style="flex:1; min-width:140px; background:rgba(88,166,255,0.06); border:1px solid rgba(88,166,255,0.2); border-radius:12px; padding:16px 20px;">
      <div style="font-size:0.7em; color:#8b949e; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px;">👁 Total Visits</div>
      <div id="statTotalVisits" style="font-size:2em; font-weight:700; color:#58a6ff;">—</div>
    </div>
  </div>
    <div style="background: rgba(88,166,255,0.06); border: 1px solid rgba(88,166,255,0.2); border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
    <div>
      <div style="font-weight: 600; color: var(--text-main); margin-bottom: 4px;"><i class="fa-solid fa-chalkboard"></i> Google Classroom Sync</div>
      <div style="font-size: 0.8em; color: #8b949e;">Pull new materials from Classroom into the portal</div>
    </div>
    <button class="btn" id="classroomSyncBtn" onclick="syncClassroom()"><i class="fa-solid fa-rotate"></i> Sync from Classroom</button>
  </div>
  <div id="classroomSyncResult" style="margin-bottom: 20px;"></div>
  
  <div class="form-group">
    <label for="categorySelect" style="color: var(--gold); font-size: 16px;">📂 Select Category to Manage</label>
    <select id="categorySelect" onchange="renderItems()" style="border: 2px solid var(--gold);">
      <option value="TICKER">Scrolling Ticker (INFO)</option>
      <option value="DSA2">DSA 2</option>
      <option value="SE">Software Engg</option>
      <option value="MATH">Complex Variables</option>
      <option value="NUM">Numerical Methods</option>
      <option value="DCOM">Data Communication</option>
      <option value="IPLAB">Internet Prog. Lab</option>
      <option value="LINKS">Reference Links</option>
      <option value="COURSES">Upcoming Courses</option>
      <option value="FACULTY">Faculty List</option>
      <option value="CLASSROOM">Classroom Code</option>
      <option value="GCLASSROOM">Google Classroom (Synced)</option>
      <option value="CLSROUTINE">Class Routine</option>
      <option value="HACKATHON">Upcoming Hackathon</option>
      <option value="CP">Upcoming CP</option>
      <option value="PQS">PQ Solutions</option>
      <option value="ROUTINE">Exam Routine</option>
      <option value="NOTES">Notes</option>
      <option value="SUG">Suggestions</option>
      <option value="BOOKS">Books</option>
    </select>
  </div>

  <div style="background: rgba(226,185,111,0.08); padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 1px solid rgba(226,185,111,0.3);">
    
    <div class="form-group">
      <label>Item Type</label>
      <select id="itemType" onchange="toggleInputMode()">
        <option value="link">🔗 Link (PDF, YouTube, Drive, Website)</option>
        <option value="upload">📤 Upload File (Image / PDF)</option>
        <option value="image">🖼️ Image (Direct Display)</option>
        <option value="text">📝 Plain Text (Notice / Info)</option>
        <option value="code">🔢 Passcode (Copyable Code)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Title Name </label>
      <input type="text" id="itemTitle" placeholder="Enter title to display">
    </div>

    <!-- Link / Text input (shown by default) -->
    <div class="form-group" id="linkInputWrap">
      <label>Content </label>
      <textarea id="itemContent" rows="3" placeholder="Paste your link here, or write your text..."></textarea>
    </div>

    <!-- File upload input (shown when "Upload File" is selected) -->
    <div class="form-group" id="fileInputWrap" style="display:none;">
      <label>Choose File (Image or PDF) </label>
      <input type="file" id="itemFile" accept="image/*,application/pdf" style="border: 2px dashed var(--gold); padding: 12px; background: rgba(226,185,111,0.05); border-radius: 8px;">
      <small style="color:#aaa; display:block; margin-top:6px;"></small>
    </div>
    
    <button class="btn" id="saveBtn" onclick="addItem()" style="width: 100%;"><i class="fa-solid fa-cloud-arrow-up"></i> Save to Database</button>
  </div>

  <h3><i class="fa-solid fa-list"></i> Current Items in Category</h3>
  <div class="item-list" id="itemList"></div>
</div> 

<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
